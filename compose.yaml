services:
  hugo:
    image: ghcr.io/gohugoio/hugo:v0.165.0
    container_name: hugo
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src

    entrypoint: ["hugo"]
    command:
      - server
      - --bind
      - 0.0.0.0
      - --port
      - "1313"
      - --buildDrafts
      - --buildFuture

    ports:
      - "1313:1313"

    volumes:
      - ./:/src
      - hugo_cache:/tmp/hugo_cache

    environment:
      HUGO_CACHEDIR: /tmp/hugo_cache
      TZ: Asia/Tokyo

volumes:
  hugo_cache:
